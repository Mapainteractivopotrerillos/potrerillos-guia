<title>Mapa · Potrerillos</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--orange:#E8825A;--dark:#1A1510;--stone:#C4B89A;--river:#2D6A7F;--sky:#87CEDC;--green:#4CAF7A}
body{font-family:'DM Sans',sans-serif;background:#111008;color:#fff;overflow-x:hidden}

.topbar{background:#1A1814;border-bottom:0.5px solid rgba(255,255,255,0.08);padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-family:'Playfair Display',serif;font-size:18px;font-style:italic;color:#F5F0E8}
.topbar-brand{font-size:10px;color:var(--orange);letter-spacing:2px;text-transform:uppercase}

.map-wrap{position:relative;width:100%;overflow:hidden;background:#141E10}
.map-wrap svg{display:block;width:100%;height:auto}

.legend{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;background:#111008;border-top:0.5px solid rgba(255,255,255,0.06)}
.leg{display:flex;align-items:center;gap:5px;font-size:10px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.5px}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

.panel{display:none;background:#1A1510;border-top:0.5px solid rgba(255,255,255,0.1)}
.panel.open{display:block}
.panel-hdr{padding:14px 16px 0;display:flex;align-items:flex-start;justify-content:space-between}
.panel-title{font-family:'Playfair Display',serif;font-size:17px;line-height:1.3;color:#F5F0E8}
.panel-badge{display:inline-block;font-size:10px;padding:3px 9px;border-radius:10px;margin-top:4px;font-family:'DM Sans',sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:0.5px}
.panel-close{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.07);border:none;color:rgba(255,255,255,0.5);font-size:16px;cursor:pointer;flex-shrink:0;font-family:'DM Sans',sans-serif}
.panel-body{padding:8px 16px 0;font-size:13px;color:rgba(255,255,255,0.6);line-height:1.6}
.panel-mads{margin:12px 16px 4px;background:rgba(232,130,90,0.08);border:0.5px solid rgba(232,130,90,0.2);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.panel-mads-text{font-size:12px;color:rgba(255,255,255,0.55);line-height:1.4;flex:1}
.panel-mads-text strong{color:var(--orange);font-weight:500}
.panel-mads-btn{background:var(--orange);color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif}
.panel-actions{display:flex;gap:8px;padding:10px 16px 16px}
.btn-main{flex:1;background:var(--orange);color:#fff;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-sec{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.6);border:0.5px solid rgba(255,255,255,0.12);border-radius:10px;padding:11px 16px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif}

.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(17,16,8,0.97);border-top:0.5px solid rgba(255,255,255,0.08);display:flex;padding:8px 0 12px;z-index:100;backdrop-filter:blur(10px)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;opacity:0.45;color:#fff;text-decoration:none}
.nav-item.active{opacity:1;color:var(--orange)}
.nav-item svg{width:22px;height:22px}
.nav-item span{font-size:9px;letter-spacing:0.5px;text-transform:uppercase;font-family:'DM Sans',sans-serif}

.wap{position:fixed;bottom:76px;right:16px;width:48px;height:48px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:100;text-decoration:none}
.spacer{height:72px}
.pin{cursor:pointer}
.pin:hover{opacity:0.8}
.pin:active{opacity:0.6}

<script>
const puntos = {
  mads:{title:'Mads Experiences',badge:'★ Experiencia premium',badgeBg:'rgba(232,130,90,0.15)',badgeColor:'#FFB894',desc:'La empresa referente de aventura en Potrerillos. Rafting en el Río Mendoza, kayak, sunset river y más. Guías certificados, fotos incluidas.',madsText:null,maps:'https://madsexperiences.com'},
  dique:{title:'Vista Panorámica del Dique',badge:'4.8 ⭐ · 2044 reseñas',badgeBg:'rgba(45,106,127,0.2)',badgeColor:'#87CEDC',desc:'El punto más fotografiado de Potrerillos. Vista completa del lago artificial rodeado de los Andes. Ideal al atardecer.',madsText:'A pocos minutos de acá arranca la aventura de rafting con Mads Experiences.',maps:'https://maps.google.com/?q=Dique+Potrerillos+Mendoza'},
  mirador1:{title:'Mirador 1 del Dique',badge:'4.8 ⭐ · 1250 reseñas',badgeBg:'rgba(92,74,50,0.3)',badgeColor:'#C4A86A',desc:'Deck de observación con bajada al agua para nadar. Venden snacks y hay piedras semipreciosas locales.',madsText:'Desde acá podés ver el recorrido del río donde opera Mads.',maps:'https://maps.google.com/?q=Mirador+Dique+Potrerillos'},
  mirador2:{title:'Mirador Principal de Potrerillos',badge:'4.8 ⭐ · 1579 reseñas',badgeBg:'rgba(92,74,50,0.3)',badgeColor:'#C4A86A',desc:'El primer acceso al dique. Kayak y SUP disponibles en la orilla. Ambiente tranquilo y vistas espectaculares.',madsText:'Bajando por el río, Mads lleva grupos de rafting por este paisaje.',maps:'https://maps.google.com/?q=Mirador+Potrerillos+Mendoza'},
  escondida:{title:'La Escondida',badge:'4.6 ⭐ · 2909 reseñas',badgeBg:'rgba(61,32,16,0.4)',badgeColor:'#E8825A',desc:'La joya gastronómica de Potrerillos. Menú de 3 pasos, cocina familiar auténtica, empanadas y costillar al asador. Solo almuerzo.',madsText:'El combo perfecto: almorzar en La Escondida y después bajar el río con Mads.',maps:'https://maps.google.com/?q=La+Escondida+Restaurante+Potrerillos'},
  chacritas:{title:'Camping Las Chacritas',badge:'4.3 ⭐ · Con dormis',badgeBg:'rgba(26,48,32,0.4)',badgeColor:'#4CAF7A',desc:'El camping más visitado de Potrerillos. Parrillas, dormitorios y baños con agua caliente. A orillas del río.',madsText:'Muchos grupos que acampan acá arrancan el rafting con Mads al día siguiente.',maps:'https://maps.google.com/?q=Camping+Chacritas+Potrerillos'},
  lasvegas:{title:'Refugio Las Vegas',badge:'4.7 ⭐ · Pet-friendly',badgeBg:'rgba(26,48,32,0.4)',badgeColor:'#4CAF7A',desc:'El camping mejor valorado de la zona. Familiar, pet-friendly, actividades para chicos. Muy limpio.',madsText:'Perfecto para familias que quieren combinar camping y aventura con Mads.',maps:'https://maps.google.com/?q=Refugio+Las+Vegas+Mendoza'},
  negritos:{title:'Los Negritos Bodegón',badge:'4.6 ⭐ · Cocina regional',badgeBg:'rgba(61,32,16,0.4)',badgeColor:'#E8825A',desc:'Bodegón de montaña auténtico. Chivito, empanadas mendocinas y parrilla. Con terraza exterior en la ladera.',madsText:'Después del rafting con Mads, Los Negritos es el cierre perfecto.',maps:'https://maps.google.com/?q=Los+Negritos+Bodegon+Potrerillos'},
};

let mapsUrl = '';

function mostrar(id) {
  const d = puntos[id];
  if (!d) return;
  document.getElementById('p-title').textContent = d.title;
  const badge = document.getElementById('p-badge');
  badge.textContent = d.badge;
  badge.style.background = d.badgeBg;
  badge.style.color = d.badgeColor;
  document.getElementById('p-body').textContent = d.desc;
  const madsEl = document.getElementById('p-mads');
  if (d.madsText === null) {
    madsEl.style.display = 'none';
  } else {
    madsEl.style.display = 'flex';
    document.getElementById('p-mads-text').textContent = d.madsText;
  }
  const btn = document.getElementById('p-maps-btn');
  btn.textContent = id === 'mads' ? 'Ver experiencias' : 'Cómo llegar';
  mapsUrl = d.maps;
  document.getElementById('panel').classList.add('open');
}

function cerrar() {
  document.getElementById('panel').classList.remove('open');
}

function abrirMaps() {
  window.open(mapsUrl, '_blank');
}
</script>
